name: Janney Montgomery Scott
description: >-
  Janney Montgomery Scott LLC is a full-service wealth management, financial
  services, and investment banking firm headquartered in Philadelphia,
  Pennsylvania, and continuously operating since 1832. A wholly owned
  subsidiary of The Penn Mutual Life Insurance Company, Janney serves
  individual investors, corporations, and municipalities through more than
  100 branch offices across the United States, with over 900 financial
  advisors managing in excess of $167 billion in client assets under advisement.
  The firm provides client account access through the MyJanney online portal
  and iOS/Android mobile apps, but does not publish a general-purpose public
  developer API, OpenAPI specification, or external developer portal.
