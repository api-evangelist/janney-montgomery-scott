strengths:
  - Long-tenured private wealth management firm with stable ownership under Penn Mutual
  - Active recruiting growth — 33 advisors and $6.5B+ in assets added in 2025
  - Established client-facing digital channels (MyJanney web + mobile)
gaps:
  - No public developer API or OpenAPI specification
  - No external developer portal or sandbox
  - No public SDKs, CLIs, or webhooks
  - GitHub organization registered but contains no public repositories
  - No public status page or machine-readable changelog
recommendation: >-
  Tier-3, no-apis. Maintain registry entry for completeness of the
  U.S. wealth management landscape but do not invest further pipeline
  cycles unless Janney publishes a partner/developer API surface or its
  parent (Penn Mutual) exposes a unified API platform.
