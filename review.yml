name: Janney Montgomery Scott
url: https://www.janney.com
type: company
tier: 3
tier-reason: no-apis
reviewed: '2026-05-23'
reviewer: Kin Lane
summary: >-
  Private Philadelphia-based wealth management and investment banking firm
  (est. 1832), wholly owned subsidiary of Penn Mutual Life. 900+ financial
  advisors across 100+ U.S. branches, $167B+ in client assets under
  advisement. Client-facing only: MyJanney online portal plus iOS/Android
  mobile apps. No public developer API, no OpenAPI spec, no developer
  portal, no SDKs. GitHub org (Janney-Montgomery-Scott) exists with zero
  public repositories. Engineering footprint is fully internal — advisor
  technology is sourced from third-party platforms (Pershing NetX360 and
  similar industry vendors) rather than built in-house and exposed.
findings:
  apis: 0
  openapi_specs: 0
  sdks: 0
  developer_portal: false
